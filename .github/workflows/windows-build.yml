name: Build Windows Packages

on:
  push:
    branches:
      - main
      - windows_zip_workflow
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A build for a commit that has since been superseded on the same PR only
# delays that PR's model sweep, which waits for this whole run. Only
# pull_request runs share a group; every other run gets its own, so branch and
# tag builds are never cancelled.
concurrency:
  group: windows-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The builds run on GitHub-hosted runners, outside the corporate proxy that
# intermittently blocks third-party downloads on the self-hosted ones.
# windows-2025-vs2026 carries Visual Studio 2026 for the windows-vs18 preset;
# setup_windows_deps.ps1 lays out the C:\dev dependencies the self-hosted
# runner has, cached between runs.
jobs:
  build-windows-portable:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # checkout's fetch-depth: 0 also applies to submodules, which pulls the
      # full msgpack-c history (~95 MB) and keeps getting reset mid-transfer on
      # the runner network. The pinned commits alone are under 1 MB.
      - name: Checkout submodules
        shell: powershell
        working-directory: .
        run: |
          for ($i = 1; $i -le 3; $i++) {
            git submodule update --init --recursive --depth 1 --jobs 4
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Submodule fetch failed (attempt $i), retrying..."
            Start-Sleep -Seconds 15
          }
          exit 1

      - name: Restore build dependencies
        uses: actions/cache@v4
        with:
          path: C:\dev
          key: windows-deps-${{ hashFiles('.github/script/setup_windows_deps.ps1', '.github/windows-deps/**') }}

      - name: Set up build dependencies
        shell: powershell
        working-directory: .
        run: .github\script\setup_windows_deps.ps1

      - name: Configure CMake
        shell: powershell
        run: |
          cmake --preset windows-vs18 -DFLM_ENABLE_OGA_HIPEP=ON

      - name: Build
        shell: powershell
        run: |
          cmake --build --preset windows-default --config Release --parallel

      - name: Prepare package files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Force $dist | Out-Null

          # Main executable
          Copy-Item -Path .\build\flm.exe -Destination $dist\ -Force

          # Required data assets
          Copy-Item -Path .\xclbins -Destination $dist\ -Recurse -Force
          Copy-Item -Path .\model_list.json -Destination $dist\ -Force
          Copy-Item -Path .\model_info.json -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_RUNTIME.txt -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_BINARY.txt -Destination $dist\ -Force
          Copy-Item -Path ..\THIRD_PARTY_NOTICES.txt -Destination $dist\ -Force
          Copy-Item -Path .\lib\xrt\*.dll -Destination $dist\ -Force
          Copy-Item -Path .\lib\*.dll -Destination $dist\ -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: src/dist/
          if-no-files-found: error

  # A second, independent configure that builds the model engines from source
  # instead of using the prebuilt DLLs in lib\xrt. Its own job so the portable
  # build (and the MSI, which packages it) does not wait on it.
  build-windows-models-from-source:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # checkout's fetch-depth: 0 also applies to submodules, which pulls the
      # full msgpack-c history (~95 MB) and keeps getting reset mid-transfer on
      # the runner network. The pinned commits alone are under 1 MB.
      - name: Checkout submodules
        shell: powershell
        working-directory: .
        run: |
          for ($i = 1; $i -le 3; $i++) {
            git submodule update --init --recursive --depth 1 --jobs 4
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Submodule fetch failed (attempt $i), retrying..."
            Start-Sleep -Seconds 15
          }
          exit 1

      - name: Restore build dependencies
        uses: actions/cache@v4
        with:
          path: C:\dev
          key: windows-deps-${{ hashFiles('.github/script/setup_windows_deps.ps1', '.github/windows-deps/**') }}

      - name: Set up build dependencies
        shell: powershell
        working-directory: .
        run: .github\script\setup_windows_deps.ps1

      - name: Configure models-from-source build
        shell: powershell
        run: |
          cmake --preset windows-vs18 `
            -B build-models-from-source `
            -DFLM_BUILD_GEMMA4E=ON

      - name: Build models from source
        shell: powershell
        run: |
          cmake --build build-models-from-source --config Release --parallel 2

      - name: Prepare models-from-source package files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist-models-from-source"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item -Path .\build-models-from-source\flm.exe -Destination $dist\ -Force
          Copy-Item -Path .\xclbins -Destination $dist\ -Recurse -Force
          Copy-Item -Path .\model_list.json -Destination $dist\ -Force
          Copy-Item -Path .\model_info.json -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_RUNTIME.txt -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_BINARY.txt -Destination $dist\ -Force
          Copy-Item -Path ..\THIRD_PARTY_NOTICES.txt -Destination $dist\ -Force
          Copy-Item -Path .\lib\xrt\*.dll -Destination $dist\ -Force
          Copy-Item -Path .\lib\*.dll -Destination $dist\ -Force
          Copy-Item -Path .\build-models-from-source\engines\*.dll -Destination $dist\ -Force

          $sourceEngine = Get-FileHash .\build-models-from-source\engines\gemma4e_npu.dll -Algorithm SHA256
          $prebuiltEngine = Get-FileHash .\lib\xrt\gemma4e_npu.dll -Algorithm SHA256
          $stagedEngine = Get-FileHash $dist\gemma4e_npu.dll -Algorithm SHA256
          if ($sourceEngine.Hash -eq $prebuiltEngine.Hash) {
            throw "The source-built Gemma 4 DLL matches the prebuilt DLL."
          }
          if ($sourceEngine.Hash -ne $stagedEngine.Hash) {
            throw "The staged Gemma 4 DLL does not match the source-built DLL."
          }

      - name: Upload models-from-source build artifact
        uses: actions/upload-artifact@v4
        with:
          name: models-from-source-fastflowlm-windows-${{ github.sha }}
          path: src/dist-models-from-source/
          if-no-files-found: error

  # Packages the flm.exe built by build-windows-portable instead of building it
  # again, so the MSI and the portable zip ship the same binary. Everything
  # else the installer stages (DLLs, xclbins, model lists) comes from the
  # checkout, so no submodules or history are needed here.
  build-windows-msi:
    runs-on: windows-2025
    needs: build-windows-portable

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download portable build artifact
        uses: actions/download-artifact@v4
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: src/portable-dist

      # get_files.bat (inno and wix) stage flm.exe from build\, where a local
      # build puts it.
      - name: Place flm.exe from portable build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item -Path .\portable-dist\flm.exe -Destination .\build\flm.exe -Force

      - name: Stage installer package files
        shell: powershell
        run: |
          cd inno
          .\get_files.bat


      # The image only has WiX 3; flm.wxs is WiX 5. Same version as the
      # self-hosted runner had.
      - name: Install WiX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed" }
          $wixToolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          & "$wixToolsPath\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed" }

          $wixToolsPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      - name: Verify WiX
        shell: powershell
        run: |
          $wix = Get-Command wix -ErrorAction Stop
          Write-Host "Using WiX: $($wix.Source)"
          wix --version


      - name: Build MSI installer
        shell: powershell
        run: |
          .\wix\build.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastflowlm-windows-msi-${{ github.sha }}
          path: src/wix/output/flm-setup.msi
          if-no-files-found: error

  build-windows-portable-hrx:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # checkout's fetch-depth: 0 also applies to submodules, which pulls the
      # full msgpack-c history (~95 MB) and keeps getting reset mid-transfer on
      # the runner network. The pinned commits alone are under 1 MB.
      - name: Checkout submodules
        shell: powershell
        working-directory: .
        run: |
          for ($i = 1; $i -le 3; $i++) {
            git submodule update --init --recursive --depth 1 --jobs 4
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Submodule fetch failed (attempt $i), retrying..."
            Start-Sleep -Seconds 15
          }
          exit 1

      # HRX needs the same Boost and curl as the XRT build; the XRT parts of
      # the tree go unused here.
      - name: Restore build dependencies
        uses: actions/cache@v4
        with:
          path: C:\dev
          key: windows-deps-${{ hashFiles('.github/script/setup_windows_deps.ps1', '.github/windows-deps/**') }}

      - name: Set up build dependencies
        shell: powershell
        working-directory: .
        run: .github\script\setup_windows_deps.ps1

      - name: Configure CMake (HRX)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $lines = & '..\hrx-integration\fetch-hrx-release.ps1' 6>&1 | ForEach-Object { $_.ToString() }
          $lines | ForEach-Object { Write-Host $_ }
          $prefix = ($lines | Where-Object { $_ -like 'HRX_CMAKE_PREFIX=*' } | Select-Object -First 1) -replace 'HRX_CMAKE_PREFIX=', ''
          if (-not $prefix) {
            throw 'failed to determine HRX_CMAKE_PREFIX from fetch-hrx-release.ps1 output'
          }
          cmake --preset windows-vs18 -DFLM_USE_HRX=ON "-DCMAKE_PREFIX_PATH=$prefix"

      - name: Build
        shell: powershell
        run: |
          cmake --build --preset windows-default --config Release --parallel

      - name: Prepare package files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Force $dist | Out-Null

          # Main executable
          Copy-Item -Path .\build\flm.exe -Destination $dist\ -Force

          # Required data assets
          Copy-Item -Path .\xclbins -Destination $dist\ -Recurse -Force
          Copy-Item -Path .\model_list.json -Destination $dist\ -Force
          Copy-Item -Path .\model_info.json -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_RUNTIME.txt -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_BINARY.txt -Destination $dist\ -Force
          Copy-Item -Path ..\THIRD_PARTY_NOTICES.txt -Destination $dist\ -Force
          Copy-Item -Path .\lib\*.dll -Destination $dist\ -Force

          # HRX-variant op libraries override the default ones
          Copy-Item -Path .\lib\hrx\*.dll -Destination $dist\ -Force

          # HRX runtime, fetched by the Configure CMake (HRX) step
          $hrxDll = Get-ChildItem -Path ..\hrx-integration\.hrx-release -Recurse -Filter 'hrx.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hrxDll) {
            throw 'hrx.dll not found under hrx-integration\.hrx-release; HRX fetch step may have failed'
          }
          Copy-Item -Path $hrxDll.FullName -Destination $dist\ -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: src/dist/
          if-no-files-found: error

